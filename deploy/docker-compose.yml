# Produkcja: gotowy obraz z GHCR (budowany przez GitHub Actions). Na serwerze nic się nie buduje.
# Aplikacja wystawia port na hosta (IPv4 + IPv6), a subdomena Mikrusa wskazuje prosto na niego.
# HTTPS robi Mikrus. Zobacz deploy/README.md.
name: secret-santa

services:
  app:
    image: ghcr.io/maciekek/secret-santa:${SECRET_SANTA_TAG:-latest}
    container_name: secret-santa
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
    ports:
      - "${HOST_PORT:-3005}:3000"
    volumes:
      - gwiazdka-data:/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  gwiazdka-data:
