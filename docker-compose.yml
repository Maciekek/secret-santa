# Produkcja (VPS): docker compose up -d --build
services:
  app:
    build: .
    image: gwiazdka:latest
    container_name: gwiazdka
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - gwiazdka-data:/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  gwiazdka-data:
