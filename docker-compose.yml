# Produkcja (VPS): docker compose up -d --build
# TLS i routing robi wspólny stack vps-proxy (Caddy czyta labele poniżej) — bez wystawiania portu.
name: secret-santa

services:
  app:
    build: .
    image: secret-santa:latest
    container_name: secret-santa
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${DOMAIN}
    networks:
      - web
    labels:
      caddy: ${DOMAIN}
      caddy.import: secure
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_1: www.${DOMAIN}
      caddy_1.redir: https://${DOMAIN}{uri} permanent
    volumes:
      - gwiazdka-data:/data
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  gwiazdka-data:

# Tworzona przez stack vps-proxy
networks:
  web:
    external: true
